<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillForge — Sélecteur de compétences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #F1F5F9; color: #0F172A; }

  /* ── Header ── */
  header { background: #0F172A; color: white; padding: 0 24px; height: 52px; display: flex; align-items: center; gap: 16px; flex-wrap: nowrap; flex-shrink: 0; }
  header h1 { font-size: 1rem; font-weight: 800; white-space: nowrap; letter-spacing: -0.02em; display: flex; align-items: center; gap: 7px; }
  header > span { opacity: 0.38; font-size: 0.75rem; white-space: nowrap; font-weight: 400; border-left: 1px solid rgba(255,255,255,0.12); padding-left: 14px; }
  .profile-area { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
  .profile-area input { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; color: white; padding: 5px 10px; font-size: 0.75rem; width: 120px; font-family: inherit; }
  .profile-area input::placeholder { color: rgba(255,255,255,0.3); }
  .header-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; color: rgba(255,255,255,0.85); padding: 5px 11px; font-size: 0.73rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.15s; font-family: inherit; letter-spacing: 0.01em; }
  .header-btn:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.26); color: white; }

  /* ── Tabs ── */
  .tabs-bar { background: #0F172A; display: flex; overflow-x: auto; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.07); flex-shrink: 0; }
  .tabs-bar::-webkit-scrollbar { height: 0; }
  .tab-btn { padding: 9px 14px; border: none; background: none; cursor: pointer; font-size: 0.78rem; font-weight: 500; color: rgba(255,255,255,0.4); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: all 0.18s; font-family: inherit; letter-spacing: 0.01em; }
  .tab-btn:hover { color: rgba(255,255,255,0.75); }
  .tab-btn.active { color: white; border-bottom-color: #818CF8; font-weight: 600; }

  .tab-panel { display: none; }
  .tab-panel.active { display: flex; flex-direction: column; height: calc(100vh - 94px); }

  /* ── Panel header ── */
  .panel-header { background: white; padding: 14px 24px; border-bottom: 1px solid #E2E8F0; display: flex; flex-direction: column; gap: 11px; flex-shrink: 0; }
  .budget-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .budget-control { display: flex; align-items: center; gap: 8px; }
  .budget-control label { font-size: 0.68rem; font-weight: 700; color: #94A3B8; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.05em; }
  .budget-control input { width: 80px; padding: 5px 9px; border: 1.5px solid #E2E8F0; border-radius: 8px; font-size: 0.85rem; text-align: right; font-family: inherit; font-weight: 600; color: #0F172A; background: #F8FAFC; transition: border-color 0.15s; }
  .budget-control input.pct-input { width: 54px; }
  .budget-control input:focus { outline: none; border-color: #818CF8; background: white; }
  .unit-suffix { font-size: 0.75rem; font-weight: 700; color: #94A3B8; margin-left: -2px; }

  .jauges { display: flex; flex-direction: column; gap: 7px; flex: 1; min-width: 280px; }
  .jauge-row { display: flex; align-items: center; gap: 10px; }
  .jauge-label { font-size: 0.65rem; font-weight: 700; width: 110px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.05em; }
  .jauge-label.oblig { color: #3B82F6; }
  .jauge-label.reco  { color: #F59E0B; }
  .jauge-label.compl { color: #8B5CF6; }
  .jauge-label.total { color: #94A3B8; }
  .jauge-bg { flex: 1; height: 7px; background: #F1F5F9; border-radius: 99px; overflow: hidden; position: relative; }
  .jauge-fill { height: 100%; border-radius: 99px; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
  .jauge-fill.oblig { background: linear-gradient(90deg, #3B82F6, #6366F1); }
  .jauge-fill.reco  { background: linear-gradient(90deg, #F59E0B, #FBBF24); }
  .jauge-fill.compl { background: linear-gradient(90deg, #8B5CF6, #A78BFA); }
  .jauge-fill-dual { height: 100%; display: flex; }
  .jauge-fill-dual .part-o { background: linear-gradient(90deg, #3B82F6, #6366F1); transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
  .jauge-fill-dual .part-r { background: linear-gradient(90deg, #F59E0B, #FBBF24); transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
  .jauge-fill-dual .part-c { background: #8B5CF6; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
  .jauge-breakdown { font-size: 0.68rem; font-weight: 500; opacity: 0.85; letter-spacing: 0.01em; white-space: nowrap; }
  .jauge-val { font-size: 0.68rem; color: #94A3B8; white-space: nowrap; min-width: 90px; font-weight: 500; }
  .jauge-val.over { color: #EF4444; font-weight: 700; }

  /* ── Pills ── */
  .pills-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .pill { font-size: 0.65rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; letter-spacing: 0.02em; }
  .pill-o { background: #DBEAFE; color: #2563EB; }
  .pill-r { background: #FEF3C7; color: #B45309; }
  .pill-c { background: #EDE9FE; color: #7C3AED; }
  .pill-p { background: #DCFCE7; color: #15803D; }

  /* ── Filtres ── */
  .filters { padding: 9px 24px; background: white; border-bottom: 1px solid #E2E8F0; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
  .filter-select, .search-input { padding: 6px 10px; border: 1.5px solid #E2E8F0; border-radius: 8px; font-size: 0.78rem; background: #F8FAFC; font-family: inherit; color: #374151; transition: border-color 0.15s, background 0.15s; }
  .filter-select:focus, .search-input:focus { outline: none; border-color: #818CF8; background: white; }
  .search-input { width: 190px; }
  .btn-reset { padding: 6px 12px; border: 1.5px solid #FECACA; border-radius: 8px; background: white; color: #EF4444; font-size: 0.78rem; cursor: pointer; font-weight: 600; font-family: inherit; transition: all 0.15s; }
  .btn-reset:hover { background: #FEF2F2; border-color: #EF4444; }
  .filter-label { font-size: 0.68rem; color: #94A3B8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

  /* ── Liste ── */
  .skills-list { flex: 1; overflow-y: auto; padding: 14px 24px; display: flex; flex-direction: column; gap: 3px; background: #F1F5F9; }
  .skill-group { margin-bottom: 10px; }
  .group-header { font-size: 0.62rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; color: #94A3B8; padding: 6px 0 5px; border-bottom: 1px solid #E2E8F0; margin-bottom: 6px; }

  /* ── Skill items ── */
  .skill-item { background: white; border: 1px solid #E2E8F0; border-left: 3px solid #E2E8F0; border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; transition: all 0.15s; box-shadow: 0 1px 2px rgba(15,23,42,0.04); }
  .skill-item:hover { box-shadow: 0 3px 10px rgba(15,23,42,0.09); transform: translateY(-1px); }
  .skill-item.is-oblig   { background: #EFF6FF; border-color: #BFDBFE; border-left-color: #3B82F6; }
  .skill-item.is-reco    { background: #FFFBEB; border-color: #FDE68A; border-left-color: #F59E0B; }
  .skill-item.is-compl   { background: #F5F3FF; border-color: #DDD6FE; border-left-color: #8B5CF6; }
  .skill-item.is-pauto-o { background: #EFF6FF; border-color: #BFDBFE; border-left-color: #93C5FD; opacity: 0.8; }
  .skill-item.is-pauto-r { background: #FFFBEB; border-color: #FDE68A; border-left-color: #FCD34D; opacity: 0.8; }
  .skill-item.is-excluded { opacity: 0.32; background: #F8FAFC; border-color: #E2E8F0; border-left-color: #CBD5E1; }

  .skill-info { flex: 1; min-width: 0; }
  .skill-name { font-size: 0.82rem; font-weight: 600; color: #0F172A; line-height: 1.35; }
  .skill-meta { font-size: 0.67rem; color: #94A3B8; margin-top: 2px; }
  .badge { font-size: 0.58rem; font-weight: 700; border-radius: 4px; padding: 1px 5px; margin-left: 5px; vertical-align: middle; letter-spacing: 0.03em; }
  .badge-sem { background: #DBEAFE; color: #1D4ED8; }
  .badge-reco-tag { background: #FEF3C7; color: #B45309; }
  .badge-auto { background: #D1FAE5; color: #065F46; font-style: italic; }
  .badge-was-o { background: #FEE2E2; color: #B91C1C; }

  .skill-xp { font-size: 0.78rem; font-weight: 700; color: #64748B; white-space: nowrap; min-width: 50px; text-align: right; flex-shrink: 0; }
  .skill-xp .xp-extra { font-size: 0.6rem; color: #CBD5E1; display: block; }

  /* ── Boutons 3 états ── */
  .state-btns { display: flex; gap: 3px; flex-shrink: 0; }
  .sbtn { width: 28px; height: 23px; border-radius: 7px; border: 1.5px solid; font-size: 0.63rem; font-weight: 800; cursor: pointer; transition: all 0.12s; background: white; display: flex; align-items: center; justify-content: center; font-family: inherit; }
  .sbtn.o { border-color: #BFDBFE; color: #3B82F6; }
  .sbtn.o:hover { background: #DBEAFE; border-color: #93C5FD; }
  .sbtn.o.active { background: #3B82F6; color: white; border-color: #3B82F6; box-shadow: 0 2px 6px rgba(59,130,246,0.4); }
  .sbtn.r { border-color: #FDE68A; color: #F59E0B; }
  .sbtn.r:hover { background: #FEF3C7; border-color: #FCD34D; }
  .sbtn.r.active { background: #F59E0B; color: white; border-color: #F59E0B; box-shadow: 0 2px 6px rgba(245,158,11,0.4); }
  .sbtn.c { border-color: #DDD6FE; color: #8B5CF6; }
  .sbtn.c:hover { background: #EDE9FE; border-color: #C4B5FD; }
  .sbtn.c.active { background: #8B5CF6; color: white; border-color: #8B5CF6; box-shadow: 0 2px 6px rgba(139,92,246,0.4); }
  .sbtn:disabled { opacity: 0.22; cursor: not-allowed; }
  .sbtn.locked { background: #F0FDF4; border-color: #86EFAC; color: #16A34A; cursor: default; }

  .empty-msg { text-align: center; padding: 40px; color: #CBD5E1; font-size: 0.85rem; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div id="pwGate" style="position:fixed;inset:0;background:#0F172A;display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="background:white;border-radius:20px;padding:40px 48px;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,0.5);max-width:380px;width:90%;">
    <div style="width:52px;height:52px;background:linear-gradient(135deg,#4F46E5,#7C3AED);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 18px;">🎯</div>
    <div style="font-size:1.3rem;font-weight:800;color:#0F172A;margin-bottom:5px;letter-spacing:-0.03em;font-family:'Inter',sans-serif;">SkillForge</div>
    <div style="font-size:0.78rem;color:#94A3B8;margin-bottom:26px;font-family:'Inter',sans-serif;font-weight:500;">UniLaSalle · Sélecteur de compétences</div>
    <input id="pwInput" type="password" placeholder="Mot de passe" autofocus
      style="width:100%;padding:10px 14px;border:1.5px solid #E2E8F0;border-radius:10px;font-size:0.92rem;text-align:center;margin-bottom:10px;font-family:'Inter',sans-serif;color:#0F172A;outline:none;transition:border-color 0.15s;" onfocus="this.style.borderColor='#818CF8'" onblur="this.style.borderColor='#E2E8F0'">
    <button onclick="checkPw()" style="width:100%;padding:10px;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:white;border:none;border-radius:10px;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:0.01em;transition:opacity 0.15s;" onmouseover="this.style.opacity='0.88'" onmouseout="this.style.opacity='1'">Accéder →</button>
    <div id="pwError" style="color:#EF4444;font-size:0.75rem;margin-top:9px;display:none;font-family:'Inter',sans-serif;">Mot de passe incorrect.</div>
  </div>
</div>
<script>
  document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });
  function checkPw() {
    if (document.getElementById('pwInput').value === 'UniLaSalle@60') {
      document.getElementById('pwGate').style.display = 'none';
      sessionStorage.setItem('sq_auth','1');
    } else {
      document.getElementById('pwError').style.display = 'block';
      document.getElementById('pwInput').value = '';
      document.getElementById('pwInput').focus();
    }
  }
  if (sessionStorage.getItem('sq_auth') === '1') document.getElementById('pwGate').style.display = 'none';
</script>

<header>
  <h1>🔩 SkillForge</h1>
  <span>Sélecteur de compétences obligatoires &amp; recommandées</span>
  <div class="profile-area">
    <span id="syncStatus" style="font-size:0.75rem;opacity:0.7;min-width:2rem;text-align:center"></span>
    <button class="header-btn" onclick="saveToCloud()">💾 Sauvegarder</button>
    <button class="header-btn" onclick="exportState()">⬇ Exporter</button>
    <label class="header-btn">⬆ Importer<input type="file" accept=".json" onchange="importState(event)" style="display:none"></label>
  </div>
</header>

ieres": {"1A AGRITEC": "S1", "1A GAB": "S1", "1A BGE": "S1", "1A EARTH": "S1", "1A AGRO": "S1", "1A ALIM": "S1"}, "prereqs": []}, {"label": "SQL Avancé", "xp": 15, "domaine": "Code et Développement", "sousDomaine": "DEVELOPPEMENT D'APPLICATION", "filieres": {}, "prereqs": ["SQL Intermédiaire"]}];
const FILIERES = ["1A AGRITEC", "1A GAB", "1A BGE", "1A EARTH", "1A AGRO", "1A ALIM"];
const BUDGETS_OBLIG = {
  '1A AGRITEC': 140, '1A GAB': 57, '1A BGE': 108,
  '1A EARTH': 187, '1A AGRO': 150, '1A ALIM': 147
};
const BUDGETS_TOTAL = {
  '1A AGRITEC': 330, '1A GAB': 130, '1A BGE': 250,
  '1A EARTH': 560, '1A AGRO': 450, '1A ALIM': 440
};
const FIREBASE_DB = 'https://skillquest-unilasalle-default-rtdb.firebaseio.com/skillquest';
function sanitizeKey(s) { return s.replace(/[.#$\/\[\]]/g, '_'); }
let userInteracted = false; // empêche loadFromCloud d'écraser un reset
function setSyncStatus(msg) { const el=document.getElementById('syncStatus'); if(el) el.textContent=msg; }

const skillMap = {};
SKILLS_DATA.forEach(s => skillMap[s.label] = s);

function getSkillXP(f, label) {
  const sk = skillMap[label];
  if (!sk) return 0;
  if (sk.xpByFiliere && f in sk.xpByFiliere) return sk.xpByFiliere[f];
  return sk.xp || 0;
}

// État par filière
const state = {};
FILIERES.forEach(f => {
  state[f] = {
    obligatoire: new Set(),
    recommande: new Set(),
    complementaire: new Set(),
    prereqs_oblig: new Set(),  // auto-prereqs of obligatoires
    prereqs_reco: new Set(),   // auto-prereqs of recommandés (not already in oblig)
    budgetPct:      Math.round((BUDGETS_OBLIG[f]||0) / (BUDGETS_TOTAL[f]||1) * 100),
    budgetOblig:    BUDGETS_OBLIG[f] || 500,
    budgetPctReco:  33,
    budgetReco:     Math.round((BUDGETS_TOTAL[f]||1000) * 0.33),
    budgetTotal:    BUDGETS_TOTAL[f] || 1000,
    wasObligatoire: new Set(),
  };
});

// Compétences avec semestre S1-S6 par filière
const recoMeta = {};
FILIERES.forEach(f => {
  recoMeta[f] = new Set(SKILLS_DATA.filter(s => f in s.filieres && s.filieres[f] && /^S[1-6]$/.test(s.filieres[f])).map(s => s.label));
});

// Initialisation des états par défaut — tout en Complémentaire
const OBLIG_PAR_DEFAUT = {
  '1A AGRO':  ['Nombres réels', 'Trigonométrie', 'Equations et inéquations'],
  '1A ALIM':  ['Nombres réels', 'Trigonométrie', 'Equations et inéquations'],
  '1A EARTH': ['Nombres réels', 'Trigonométrie', 'Equations et inéquations'],
};
FILIERES.forEach(f => {
  const obligDefaut = new Set(OBLIG_PAR_DEFAUT[f] || []);
  SKILLS_DATA.filter(s => f in s.filieres).forEach(skill => {
    if (obligDefaut.has(skill.label)) state[f].obligatoire.add(skill.label);
    else state[f].complementaire.add(skill.label);
  });
  recomputePrereqs(f);
});

// --- Logique ---
function getAllPrereqs(label, visited = new Set()) {
  if (visited.has(label)) return visited;
  visited.add(label);
  const skill = skillMap[label];
  if (skill) skill.prereqs.forEach(p => getAllPrereqs(p, visited));
  return visited;
}

function recomputePrereqs(f) {
  const s = state[f];
  const newPO = new Set();
  s.obligatoire.forEach(sel => {
    const all = getAllPrereqs(sel); all.delete(sel);
    all.forEach(p => { if (!s.obligatoire.has(p)) newPO.add(p); });
  });
  s.prereqs_oblig = newPO;

  const newPR = new Set();
  s.recommande.forEach(sel => {
    const all = getAllPrereqs(sel); all.delete(sel);
    all.forEach(p => {
      // Exclure les skills déjà explicitement choisis (O, PO, R, C)
      if (!s.obligatoire.has(p) && !newPO.has(p) && !s.recommande.has(p)) newPR.add(p);
    });
  });
  s.prereqs_reco = newPR;
}

function getXP_oblig(f) {
  const s = state[f];
  let t = 0;
  s.obligatoire.forEach(l => t += getSkillXP(f, l));
  s.prereqs_oblig.forEach(l => t += getSkillXP(f, l));
  return t;
}
function getXP_reco(f) {
  const s = state[f];
  let t = 0;
  s.recommande.forEach(l => t += getSkillXP(f, l));
  s.prereqs_reco.forEach(l => t += getSkillXP(f, l));
  return t;
}
function getXP_compl(f) {
  const s = state[f];
  let t = 0;
  s.complementaire.forEach(l => { if (getSkillStatus(f, l) === 'C') t += getSkillXP(f, l); });
  return t;
}

function getMarginal(f, label) {
  const s = state[f];
  const allCovered  = new Set([...s.obligatoire, ...s.prereqs_oblig, ...s.recommande, ...s.prereqs_reco]);
  const allOBucket  = new Set([...s.obligatoire, ...s.prereqs_oblig]);
  const allP = getAllPrereqs(label);
  allP.delete(label);
  const own = getSkillXP(f, label);
  let extra  = 0; // prérequis totalement non couverts (nouveaux XP)
  let extraO = 0; // prérequis déjà en R/PR qui migreraient vers O si sélectionné en O
  allP.forEach(p => {
    if (!allCovered.has(p)) extra += getSkillXP(f, p);
    else if (!allOBucket.has(p)) extraO += getSkillXP(f, p);
  });
  return { own, extra, extraO, total: own + extra };
}

function setSkillState(f, label, newState) {
  const s = state[f];
  // Retirer de tous les ensembles manuels
  s.obligatoire.delete(label);
  s.recommande.delete(label);
  s.complementaire.delete(label);
  if (newState === 'O') s.obligatoire.add(label);
  else if (newState === 'R') s.recommande.add(label);
  else if (newState === 'C') s.complementaire.add(label);
  // si newState === null → déselectionné
  recomputePrereqs(f);
}

function getSkillStatus(f, label) {
  const s = state[f];
  if (s.obligatoire.has(label)) return 'O';
  if (s.prereqs_oblig.has(label)) return 'PO';
  if (s.recommande.has(label)) return 'R';
  if (s.prereqs_reco.has(label)) return 'PR';
  if (s.complementaire.has(label)) return 'C';
  return null;
}

function getRequiredBy(f, label) {
  const s = state[f];
  const requiredByO = [...s.obligatoire].filter(sel => {
    const p = getAllPrereqs(sel); p.delete(sel); return p.has(label);
  });
  const requiredByR = [...s.recommande].filter(sel => {
    const p = getAllPrereqs(sel); p.delete(sel); return p.has(label);
  });
  return { requiredByO, requiredByR };
}

function buildUI() {
  const bar = document.getElementById('tabsBar');
  const panels = document.getElementById('tabPanels');
  FILIERES.forEach((f, idx) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (idx===0?' active':'');
    btn.textContent = f.replace('1A ','');
    btn.dataset.f = f;
    btn.onclick = () => switchTab(f);
    bar.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'tab-panel' + (idx===0?' active':'');
    panel.id = 'panel-' + f;
    panel.innerHTML = buildPanelHTML(f);
    panels.appendChild(panel);
    attachEvents(f);
  });
}

function attachEvents(f) {
  ['pO','pR','bT'].forEach(id => document.getElementById(id+'-'+f).addEventListener('input', () => renderList(f)));
  ['search','typeF','domF','semF'].forEach(id => document.getElementById(id+'-'+f).addEventListener('input', () => renderList(f)));
  document.getElementById('reset-'+f).addEventListener('click', () => {
    try {
      userInteracted = true;
      // Réinitialiser les filtres pour que les compétences soient visibles
      document.getElementById('typeF-'+f).value = '';
      document.getElementById('search-'+f).value = '';
      document.getElementById('domF-'+f).value = '';
      document.getElementById('semF-'+f).value = '';
      // Reset complet : tout → C
      state[f].obligatoire    = new Set();
      state[f].recommande     = new Set();
      state[f].complementaire = new Set();
      state[f].wasObligatoire = new Set();
      SKILLS_DATA.filter(sk => f in sk.filieres).forEach(skill => {
        state[f].complementaire.add(skill.label);
      });
      recomputePrereqs(f);
      renderList(f);
      // Confirmation visuelle
      const btn = document.getElementById('reset-'+f);
      btn.textContent = '✓ Réinitialisé';
      btn.style.background = '#DCFCE7';
      btn.style.borderColor = '#16A34A';
      btn.style.color = '#15803D';
      setTimeout(() => {
        btn.textContent = 'Réinitialiser';
        btn.style.background = '';
        btn.style.borderColor = '';
        btn.style.color = '';
      }, 1500);
    } catch(e) {
      alert('Erreur reset : ' + e.message);
    }
  });
  renderList(f);
}

function renderList(f) {
  const s = state[f];
  s.budgetTotal    = parseInt(document.getElementById('bT-'+f).value)||0;
  s.budgetPct      = parseInt(document.getElementById('pO-'+f).value)||0;
  s.budgetOblig    = Math.round(s.budgetTotal * s.budgetPct / 100);
  s.budgetPctReco  = parseInt(document.getElementById('pR-'+f).value)||0;
  s.budgetReco     = Math.round(s.budgetTotal * s.budgetPctReco / 100);

  const xpO = getXP_oblig(f);
  const xpR = getXP_reco(f);
  const xpC = getXP_compl(f);
  const xpTotal = xpO + xpR;
  const bO = s.budgetOblig, bT = s.budgetTotal, bR = s.budgetReco;

  // Jauge Obligatoires
  const pctO = bO>0 ? Math.min(100,(xpO/bO)*100) : 0;
  const overO = xpO > bO;
  document.getElementById('jO-'+f).style.width = pctO+'%';
  document.getElementById('jO-'+f).style.background = '#2563eb';
  document.getElementById('jOv-'+f).textContent = xpO+' / '+bO+' XP';
  document.getElementById('jOv-'+f).className = 'jauge-val'+(overO?' over':'');

  // Jauge Recommandés
  const overR = xpR > bR;
  document.getElementById('jR-'+f).style.width = (bR>0 ? Math.min(100,(xpR/bR)*100) : 0)+'%';
  document.getElementById('jRv-'+f).textContent = xpR+' / '+bR+' XP';
  document.getElementById('jRv-'+f).className = 'jauge-val'+(overR?' over':'');


  // Jauge Total (bleu O + ambre R + violet restant)
  const overT = xpTotal > bT;
  const pctTotalO = bT>0 ? Math.min(100, (xpO/bT)*100) : 0;
  const pctTotalR = bT>0 ? Math.min(100-pctTotalO, (xpR/bT)*100) : 0;
  const pctTotalC = Math.max(0, 100 - pctTotalO - pctTotalR);
  document.getElementById('jT-'+f).children[0].style.width = pctTotalO+'%';
  document.getElementById('jT-'+f).children[1].style.width = pctTotalR+'%';
  document.getElementById('jT-'+f).children[2].style.width = pctTotalC+'%';
  const pO = bT > 0 ? Math.round(xpO / bT * 100) : 0;
  const pR = bT > 0 ? Math.round(xpR / bT * 100) : 0;
  const pC = bT > 0 && xpC > 0 ? Math.round(xpC / bT * 100) : 0;
  const breakdown = (pO + pR + pC > 0)
    ? `<br><span class="jauge-breakdown">` +
      `<span style="color:#3B82F6">${pO}%</span>&thinsp;O` +
      ` · <span style="color:#F59E0B">${pR}%</span>&thinsp;R` +
      (pC > 0 ? ` · <span style="color:#8B5CF6">${pC}%</span>&thinsp;C` : '') +
      `</span>` : '';
  document.getElementById('jTv-'+f).innerHTML = `${xpTotal}&thinsp;/&thinsp;${bT}&thinsp;XP${breakdown}`;
  document.getElementById('jTv-'+f).className = 'jauge-val'+(overT?' over':'');

  // Pills
  const nbPR = [...s.prereqs_oblig,...s.prereqs_reco].length;
  document.getElementById('pills-'+f).innerHTML =
    (s.obligatoire.size ? `<span class="pill pill-o">${s.obligatoire.size} oblig.</span>` : '') +
    (s.recommande.size ? `<span class="pill pill-r">${s.recommande.size} reco.</span>` : '') +
    (s.complementaire.size ? `<span class="pill pill-c">${s.complementaire.size} compl.</span>` : '') +
    (nbPR ? `<span class="pill pill-p">${nbPR} prérequis auto</span>` : '');

  const search = document.getElementById('search-'+f).value.toLowerCase();
  const typeF = document.getElementById('typeF-'+f).value;
  const domF = document.getElementById('domF-'+f).value;
  const semF = document.getElementById('semF-'+f).value;

  // Grouper par sous-domaine
  const groups = {};
  SKILLS_DATA.forEach(skill => {
    const grp = skill.sousDomaine || skill.domaine || 'Autre';
    if (!groups[grp]) groups[grp] = [];
    groups[grp].push(skill);
  });

  const listEl = document.getElementById('list-'+f);
  listEl.innerHTML = '';
  let anyVisible = false;

  const statusOrd = l => {
    const st = getSkillStatus(f, l);
    if (st==='O') return 0; if (st==='PO') return 1;
    if (st==='R') return 2; if (st==='PR') return 3;
    if (st==='C') return 4; return 5;
  };

  Object.keys(groups).sort().forEach(grp => {
    const skills = groups[grp].sort((a,b) => statusOrd(a.label)-statusOrd(b.label) || a.label.localeCompare(b.label));
    let grpVisible = false;
    const grpEl = document.createElement('div'); grpEl.className = 'skill-group';
    const hEl = document.createElement('div'); hEl.className = 'group-header'; hEl.textContent = grp;
    grpEl.appendChild(hEl);

    skills.forEach(skill => {
      const status = getSkillStatus(f, skill.label);
      const semestre = skill.filieres[f] || '';
      const isRecoMeta = recoMeta[f].has(skill.label);

      // Filtres
      if (search && !skill.label.toLowerCase().includes(search) && !skill.sousDomaine.toLowerCase().includes(search)) return;
      if (domF && (skill.sousDomaine||skill.domaine) !== domF) return;
      if (semF && semestre !== semF) return;
      if (typeF === 'O' && status !== 'O') return;
      if (typeF === 'R' && status !== 'R') return;
      if (typeF === 'C' && status !== 'C') return;
      if (typeF === 'reco-meta' && !isRecoMeta) return;

      anyVisible = true; grpVisible = true;

      const itemEl = document.createElement('div');
      let cls = 'skill-item';
      if (status==='O') cls += ' is-oblig';
      else if (status==='R') cls += ' is-reco';
      else if (status==='C') cls += ' is-compl';
      else if (status==='PO') cls += ' is-pauto-o';
      else if (status==='PR') cls += ' is-pauto-r';
      else cls += ' is-excluded';
      itemEl.className = cls;

      const marginal = getMarginal(f, skill.label);
      const wasO = s.wasObligatoire ? s.wasObligatoire.has(skill.label) : false;
      const semTag = semestre ? `<span class="badge badge-sem">${semestre}</span>` : '';
      const recoTag = isRecoMeta && status === 'C' && !wasO ? `<span class="badge badge-reco-tag">↩ Recommandée</span>` : '';
      const wasOTag = wasO && status === 'C' ? `<span class="badge badge-was-o">↩ Était O</span>` : '';
      const autoTag = (status==='PO'||status==='PR') ? `<span class="badge badge-auto">prérequis auto</span>` : '';

      const skillXp = getSkillXP(f, skill.label);
      let xpStr = `<span>${skillXp} XP</span>`;
      if ((status === 'C' || status === null) && marginal.extra > 0)
        xpStr = `<span>${marginal.total} XP<span class="xp-extra">+${marginal.extra} préreq.</span></span>`;
      else if ((status === 'C' || status === null) && marginal.extraO > 0)
        xpStr = `<span>${skillXp} XP<span class="xp-extra" title="Prérequis déjà en R qui passeraient en O">+${marginal.extraO} si O</span></span>`;

      // Boutons état — seul le total bloque
      const isAuto = status==='PO'||status==='PR';
      const canAdd = !overT || status==='O' || status==='R';

      const isPO = status === 'PO'; // prérequis forcé par un Obligatoire → tout grisé
      const isPR = status === 'PR'; // prérequis d'un Recommandé → O et R actifs, C grisé
      // PR : XP déjà dans le budget R, ne bloque pas sur budget
      const canAddAdj = !overT || status==='O' || status==='R' || isPR;
      // Escape apostrophes pour éviter de casser l'attribut onclick
      const safeLabel = skill.label.replace(/'/g, "\\'");
      const btnO = `<button class="sbtn o${status==='O'?' active':''}" onclick="handleBtn('${f}','${safeLabel}','O')" ${isPO||(!canAddAdj&&status!=='O')?'disabled':''} title="${isPR?'Forcer en Obligatoire':'Obligatoire'}">O</button>`;
      const btnR = `<button class="sbtn r${status==='R'?' active':''}" onclick="handleBtn('${f}','${safeLabel}','R')" ${isPO||(!canAddAdj&&status!=='R')?'disabled':''} title="Recommandé">R</button>`;
      const btnC = `<button class="sbtn c${status==='C'?' active':''}" onclick="handleBtn('${f}','${safeLabel}','C')" ${isAuto?'disabled':''} title="Complémentaire">C</button>`;

      itemEl.innerHTML = `
        <div class="state-btns">${btnO}${btnR}${btnC}</div>
        <div class="skill-info">
          <div class="skill-name">${skill.label}${semTag}${recoTag}${wasOTag}${autoTag}</div>
          <div class="skill-meta">${skill.sousDomaine||skill.domaine}</div>
        </div>
        <div class="skill-xp">${xpStr}</div>
      `;
      grpEl.appendChild(itemEl);
    });

    if (grpVisible) listEl.appendChild(grpEl);
  });

  if (!anyVisible) listEl.innerHTML = '<div class="empty-msg">Aucune compétence ne correspond aux filtres.</div>';
  autoSave(f);
}

function handleBtn(f, label, newState) {
  const s = state[f];
  const status = getSkillStatus(f, label);

  // Mémoriser qu'une compétence quitte le statut O
  if (status === 'O' && newState !== 'O') s.wasObligatoire.add(label);

  // Si déjà dans cet état → toggle
  if (newState==='O' && status==='O') {
    // Rétrograder en C (jamais en R) et mémoriser
    s.wasObligatoire.add(label);
    setSkillState(f, label, 'C');
    recomputePrereqs(f);
    renderList(f);
    return;
  }
  if ((newState==='R' && status==='R') || (newState==='C' && status==='C')) {
    setSkillState(f, label, null);
    renderList(f);
    return;
  }

  // Interdire C si la compétence est un prérequis d'un O ou R
  if (newState === 'C') {
    const isPrereqOfOR = [...s.obligatoire, ...s.recommande].some(sel => {
      const p = getAllPrereqs(sel); p.delete(sel); return p.has(label);
    });
    if (isPrereqOfOR) {
      alert(`"${label}" est un prérequis d'une compétence Obligatoire ou Recommandée et ne peut pas être mis en Complémentaire.`);
      return;
    }
  }

  // Contraintes budget
  if (newState === 'O' || newState === 'R') {
    const xpO = getXP_oblig(f), xpR = getXP_reco(f);
    const m = getMarginal(f, label);
    const own = getSkillXP(f, label);
    const freedO = (status==='O' || status==='PO') ? own : 0;
    const freedR = (status==='R' || status==='PR') ? own : 0;

    // 1. Vérif budget total (O+R)
    const newTotal = (xpO - freedO) + (xpR - freedR) + m.total;
    if (newTotal > s.budgetTotal) {
      alert(`Budget total (O+R) insuffisant.\n\nCe choix dépasserait le budget total de ${s.budgetTotal} XP.`);
      return;
    }

    // 2. Vérif budget obligatoire (O+PO) — uniquement si on passe en O
    if (newState === 'O') {
      const inOBucket = new Set([...s.obligatoire, ...s.prereqs_oblig]);
      const allP = getAllPrereqs(label); allP.delete(label);
      let extraToO = 0;
      allP.forEach(p => { if (!inOBucket.has(p)) extraToO += getSkillXP(f, p); });
      const newXpOblig = (xpO - freedO) + own + extraToO;
      if (newXpOblig > s.budgetOblig) {
        alert(`Budget obligatoire (${s.budgetPct}% = ${s.budgetOblig} XP) dépassé.\n\nCe choix porterait les compétences O+PO à ${newXpOblig} XP.`);
        return;
      }
    }

    // 3. Vérif budget recommandé (R+PR) — uniquement si on passe en R
    if (newState === 'R') {
      const inRBucket = new Set([...s.recommande, ...s.prereqs_reco]);
      const inOBucket = new Set([...s.obligatoire, ...s.prereqs_oblig]);
      const allP = getAllPrereqs(label); allP.delete(label);
      let extraToR = 0;
      allP.forEach(p => { if (!inRBucket.has(p) && !inOBucket.has(p)) extraToR += getSkillXP(f, p); });
      const newXpReco = (xpR - freedR) + own + extraToR;
      if (newXpReco > s.budgetReco) {
        alert(`Budget recommandé (${s.budgetPctReco}% = ${s.budgetReco} XP) dépassé.\n\nCe choix porterait les Recommandés à ${newXpReco} XP.`);
        return;
      }
    }
  }

  setSkillState(f, label, newState);

  // Cascade C : pré-requis null → C
  if (newState === 'C') {
    const allP = getAllPrereqs(label);
    allP.delete(label);
    allP.forEach(p => { if (getSkillStatus(f, p) === null) s.complementaire.add(p); });
    recomputePrereqs(f);
  }

  renderList(f);
}

function switchTab(f) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.f===f));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id==='panel-'+f));
}

// ─── Sauvegarde ───────────────────────────────────────────────────────────────

function serializeState(f) {
  const s = state[f];
  return {
    obligatoire:   [...s.obligatoire],
    recommande:    [...s.recommande],
    complementaire:[...s.complementaire],
    budgetPct:      s.budgetPct,
    budgetTotal:    s.budgetTotal,
    budgetPctReco:  s.budgetPctReco,
    wasObligatoire: [...s.wasObligatoire]
  };
}

function deserializeState(f, data) {
  if (!data) return;
  state[f].obligatoire    = new Set(data.obligatoire    || []);
  state[f].recommande     = new Set(data.recommande     || []);
  state[f].complementaire = new Set(data.complementaire || []);
  // budgetTotal toujours depuis BUDGETS_TOTAL (ne pas restaurer depuis les saves)
  const bTDefault = BUDGETS_TOTAL[f] || 1000;
  state[f].budgetTotal = bTDefault;
  const elBT = document.getElementById('bT-'+f); if (elBT) elBT.value = bTDefault;
  if (data.budgetPct != null) { state[f].budgetPct = data.budgetPct; const el = document.getElementById('pO-'+f); if (el) el.value = data.budgetPct; }
  if (data.budgetPctReco  != null) { state[f].budgetPctReco  = data.budgetPctReco;  const el = document.getElementById('pR-'+f); if (el) el.value = data.budgetPctReco; }
  if (data.wasObligatoire) state[f].wasObligatoire = new Set(data.wasObligatoire);
  recomputePrereqs(f);
}

function autoSave(f) {
  try { localStorage.setItem('sq_selection_' + f, JSON.stringify(serializeState(f))); } catch(e) {}
}

function autoLoad(f) {
  const saved = localStorage.getItem('sq_selection_' + f);
  if (saved) { try { deserializeState(f, JSON.parse(saved)); } catch(e) {} }
}

async function loadFromCloud() {
  setSyncStatus('⏳');
  try {
    const resp = await fetch(`${FIREBASE_DB}/selections.json`);
    const data = resp.ok ? await resp.json() : null;
    if (data && !userInteracted) {
      FILIERES.forEach(f => {
        const entry = data[encodeURIComponent(f)] || data[f];
        if (entry) { deserializeState(f, entry); localStorage.setItem('sq_selection_' + f, JSON.stringify(entry)); }
      });
      FILIERES.forEach(f => renderList(f));
      setSyncStatus('☁️');
    } else {
      setSyncStatus('');
    }
  } catch(e) { setSyncStatus('⚠️'); }
}

async function saveToCloud() {
  setSyncStatus('⏳');
  const data = {};
  FILIERES.forEach(f => { data[encodeURIComponent(f)] = serializeState(f); });
  try {
    await fetch(`${FIREBASE_DB}/selections.json`, {
      method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
    });
    setSyncStatus('☁️ ok');
  } catch(e) { setSyncStatus('⚠️'); }
}

function exportState() {
  const data = { filieres: {} };
  FILIERES.forEach(f => { data.filieres[f] = serializeState(f); });
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'skillquest_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importState(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      const fData = data.filieres || data;
      FILIERES.forEach(f => { if (fData[f]) deserializeState(f, fData[f]); });
      FILIERES.forEach(f => renderList(f));
    } catch(err) { alert('Fichier invalide.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ─────────────────────────────────────────────────────────────────────────────

buildUI();
// Restaurer depuis localStorage (instantané)
FILIERES.forEach(f => { autoLoad(f); renderList(f); });
// Synchroniser depuis Firebase
loadFromCloud();
</script>
